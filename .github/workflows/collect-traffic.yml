name: Collect traffic snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: traffic-snapshots
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect public traffic
        id: collect
        continue-on-error: true
        run: node scripts/collect-traffic.mjs
      - name: Collect global AIS when configured
        id: ais
        continue-on-error: true
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: node scripts/collect-global-ais.mjs
      - name: Save successful sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for dir in commercial-data maritime-data global-vessel-data; do
            if [ -f "$dir/latest.json" ]; then git add -- "$dir/latest.json"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update traffic snapshots'
            git pull --rebase origin main
            git push
          fi
      - name: Report source failure
        if: steps.collect.outcome == 'failure' || steps.ais.outcome == 'failure'
        run: exit 1
